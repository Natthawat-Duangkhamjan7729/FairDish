<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[Dev Beta] FairDish — จ่ายตามที่กินจริง จบทุกมื้ออย่างแฟร์</title>
<meta name="description" content="FairDish คำนวณค่าอาหารจากเมนูที่แต่ละคนกินจริง รวมค่าส่วนกลางให้อัตโนมัติ แล้วสรุปเป็นบิลที่ส่งเข้ากลุ่มได้ทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF6DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1426" media="(prefers-color-scheme: dark)">
<!-- ใช้ธีมที่ผู้ใช้เลือกไว้ก่อนวาดหน้า กันจอกะพริบ (ค่าเดียวกับ Store.themeKey) -->
<script>try{var t=localStorage.getItem("fairdish:theme:v1");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FairDish">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>


<div class="sandbox-bar dev-beta" role="note">🛠️ Developer Beta — ฟีเจอร์ใหม่ยังไม่นิ่ง ข้อมูลแยกจากตัวเต็ม <a href="https://fairdish.vercel.app">ไปตัวเต็ม</a></div>
<!-- v3.2: หน้าตาแบบแอปมือถือ — ทุกหน้ามีแถบหัวของตัวเอง (สร้างใน js/pages.js) จอคอมจัดไว้กลางจอ -->
<div class="app-shell">
<main id="view"></main>

<footer class="foot">
  <span>FairDish v3.2 Developer Beta · ผลงานกลุ่ม คณะมนุษยศาสตร์และสังคมศาสตร์ มหาวิทยาลัยขอนแก่น</span>
</footer>
</div>

<!-- v3.2: แท็บล่าง หน้าหลัก / หารบิล (เลือกประเภทก่อน) / ประวัติ — ซ่อนในหน้าหารบิลและใบสรุปยอด -->
<nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    <span>หน้าหลัก</span></a>
  <button type="button" class="tab-new" data-open-kind="1" aria-haspopup="dialog">
    <span class="tab-plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span>หารบิล</span></button>
  <a href="#/history" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>ประวัติ</span></a>
</nav>

<!-- v3.2: แผ่นล่างจอนอกหน้าหารบิล (เลือกประเภทบิล, ตั้งชื่อบิล) — เนื้อหาสร้างโดย js/actions.js -->
<div id="globalSheet"></div>

<!-- v2.3: หน้าต่างวิธีติดตั้งแอป (เนื้อหาสร้างโดย js/install.js) -->
<dialog class="install-dialog" id="installDialog" aria-labelledby="installTitle"></dialog>
<!-- v2.4: ถาม "คุณคือใคร" ตอนเปิดกลุ่มครั้งแรก (เนื้อหาสร้างโดย js/actions.js) -->
<dialog class="install-dialog" id="meDialog" aria-labelledby="meTitle"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js" defer></script>

<script src="/_vercel/insights/script.js" defer></script>
</body>
</html>
