<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FairDish — จ่ายตามที่กินจริง จบทุกมื้ออย่างแฟร์</title>
<meta name="description" content="FairDish คำนวณค่าอาหารจากเมนูที่แต่ละคนกินจริง รวมค่าส่วนกลางให้อัตโนมัติ แล้วสรุปเป็นบิลที่ส่งเข้ากลุ่มได้ทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF6DF" id="themeColor">
<!-- ใช้ธีมที่ผู้ใช้เลือกไว้ก่อนวาดหน้า กันจอกะพริบ (ค่าเดียวกับ Store.themeKey) -->
<!-- v4.5.3: ธีม ตามระบบ / มืด / สว่าง — ยังไม่เคยเลือก = สว่าง (ค่าเดียวกับ Store.themeKey) -->
<script>(function(){var t="light";try{var s=localStorage.getItem("fairdish:theme:v1");if(s==="dark"||s==="system")t=s;}catch(e){}if(t!=="system")document.documentElement.setAttribute("data-theme",t);var d=t==="dark"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.getElementById("themeColor").setAttribute("content","#1A1426");})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FairDish">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body>


<!-- v3.2+: หน้าตาแบบแอปมือถือ — ทุกหน้ามีแถบหัวของตัวเอง (สร้างใน js/pages.js) จอคอมจัดไว้กลางจอ -->
<div class="app-shell">
<main id="view"></main>

<footer class="foot">
  <span>FairDish v4.15 · <span data-i18n="ผลงานกลุ่ม คณะมนุษยศาสตร์และสังคมศาสตร์ มหาวิทยาลัยขอนแก่น">ผลงานกลุ่ม คณะมนุษยศาสตร์และสังคมศาสตร์ มหาวิทยาลัยขอนแก่น</span></span>
</footer>
</div>

<!-- v3.2+: แท็บล่าง หน้าหลัก / หารบิล (เลือกประเภทก่อน) / ประวัติ — มือถือเท่านั้น ซ่อนในหน้าหารบิลและใบสรุปยอด -->
<nav class="tabbar" id="tabbar" aria-label="เมนูหลัก" data-i18n-label="เมนูหลัก">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    <span data-i18n="หน้าหลัก">หน้าหลัก</span></a>
  <button type="button" class="tab-new" data-open-kind="1" aria-haspopup="dialog">
    <span class="tab-plus" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span data-i18n="หารบิล">หารบิล</span></button>
  <a href="#/history" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span data-i18n="ประวัติ">ประวัติ</span></a>
</nav>

<!-- v4.4: แถบนำทางซ้ายของจอใหญ่ (≥600px แท็บเล็ต = แถบไอคอน, ≥1280px คอม = แถบเต็ม) — เนื้อหาสร้างโดย renderSideNav() ใน js/wide.js -->
<nav class="sidenav" id="sidenav" aria-label="เมนูหลัก" data-i18n-label="เมนูหลัก" hidden></nav>

<!-- v3.2+: แผ่นล่างจอนอกหน้าหารบิล (เลือกประเภทบิล, ตั้งชื่อบิล) — เนื้อหาสร้างโดย js/actions.js -->
<div id="globalSheet"></div>

<!-- v2.3: หน้าต่างวิธีติดตั้งแอป (เนื้อหาสร้างโดย js/install.js) -->
<dialog class="install-dialog" id="installDialog" aria-labelledby="installTitle"></dialog>
<!-- v2.4: ถาม "คุณคือใคร" ตอนเปิดกลุ่มครั้งแรก (เนื้อหาสร้างโดย js/actions.js) -->
<dialog class="install-dialog" id="meDialog" aria-labelledby="meTitle"></dialog>
<!-- v4.11: หน้าต่างชวนเพื่อน (QR + ลิงก์ + คนในกลุ่ม) เปิดทับหน้าเดิมทั้งมือถือและจอใหญ่ (เนื้อหาสร้างโดย js/confirm.js) -->
<dialog class="install-dialog share-dialog" id="shareDialog" aria-labelledby="shareTitle"></dialog>
<!-- v4.13: หน้าต่างสแกน QR เข้ากลุ่ม (กล้องหลัง + กรอบสแกน) เนื้อหาสร้างโดย js/actions.js -->
<dialog class="install-dialog scan-dialog" id="scanDialog" aria-labelledby="scanTitle"></dialog>
<!-- v4.14: เปิดในแอปแชต (LINE / IG / Messenger …) → หน้าต่างแนะนำเปิดในเบราว์เซอร์จริง (เนื้อหาสร้างโดย js/install.js) -->
<dialog class="install-dialog inapp-dialog" id="inappDialog" aria-labelledby="inappTitle"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- v4.5: ชั้นสอนใช้แบบกดจริง (เนื้อหาสร้างโดย js/tour.js) -->
<div class="tour" id="tour" hidden></div>

<script src="js/config.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/i18n-en.js" defer></script>
<script src="js/store.js" defer></script>
<script src="js/state.js" defer></script>
<script src="js/qr.js" defer></script>
<script src="js/seal.js" defer></script>
<script src="js/cloud.js" defer></script>
<script src="js/menu-library.js" defer></script>
<script src="js/library-en.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/save.js" defer></script>
<script src="js/calc.js" defer></script>
<script src="js/receipt.js" defer></script>
<script src="js/pages.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/actions.js" defer></script>
<script src="js/shared-library.js" defer></script>
<script src="js/install.js" defer></script>
<script src="js/share-image.js" defer></script>
<script src="js/confirm.js" defer></script>
<script src="js/wide.js" defer></script>
<script src="js/tour.js" defer></script>
<script src="js/profile.js" defer></script>
<script src="js/router.js" defer></script>
<script src="js/events.js" defer></script>
<script src="js/main.js" defer></script>
<!-- Vercel Web Analytics นับผู้เข้าชม ไฟล์นี้ Vercel ให้มาเองตอน deploy ไม่ต้องมีในโปรเจกต์ -->
<script src="/_vercel/insights/script.js" defer></script>
</body>
</html>
