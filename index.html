<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FairDish — จ่ายตามที่กินจริง จบทุกมื้ออย่างแฟร์</title>
<meta name="description" content="FairDish คำนวณค่าอาหารจากเมนูที่แต่ละคนกินจริง รวมค่าส่วนกลางให้อัตโนมัติ แล้วสรุปเป็นบิลที่ส่งเข้ากลุ่มได้ทันที">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   FairDish — ระบบดีไซน์
   ฟอนต์   : Bai Jamjuree (หัวข้อ) + Sarabun (เนื้อหา) + IBM Plex Mono (ตัวเลขเงิน)
   สีหลัก  : เขียวใบเตย #156B52 — ปุ่ม ลิงก์ และยอดที่ถูกต้อง
   สีรอง   : ส้มมะม่วง #F0A33C / #9A500B — จุดเน้น คำเตือน และฝั่ง "หารเท่ากัน"
   ตัวอักษร: 4 ระดับเท่านั้น (display / title / body / small)
   ระยะห่าง: สเกลฐาน 4px (--s1 ถึง --s9) ใช้ทั้งแอป ไม่มีค่าสุ่ม
   =================================================================== */
:root{
  /* ---- สี (สไตล์ ICE: ครีมวานิลลา + พลัม + คอรัล + มิ้นต์) ---- */
  --bg:#FFF6DF;
  --surface:#FFFDF7;
  --surface-2:#FFFFFF;
  --paper:#FFFFFF;
  --line:#EFE3D3;
  --line-2:#DCCEBF;

  --ink:#31224D;
  --ink-2:#574B69;
  --ink-3:#756A85;

  --primary:#FF6D7A;          /* คอรัล — ใช้ถมปุ่มเท่านั้น */
  --primary-strong:#FF8290;
  --on-primary:#31224D;       /* ตัวอักษรบนคอรัลต้องเป็นพลัมจึงผ่าน WCAG AA (ขาวได้แค่ 2.7:1) */
  --primary-soft:#DDFAEF;     /* มิ้นต์ — ชิปสมาชิก, คนที่เลือก, ฝั่ง FairDish */
  --primary-ink:#17664D;

  --link:#7048E8;             /* ม่วง — eyebrow, ลิงก์, สถานะ active */
  --link-soft:#FAF2FF;

  --secondary:#FFF3BD;        /* อำพัน — ตราใบเสร็จ, คำเตือน, ฝั่งหารเท่ากัน */
  --secondary-ink:#98631B;
  --secondary-soft:#FFF3BD;
  --spark:#FFF4BC;
  --spark-ink:#7D5B12;

  --danger:#B23A48;
  --danger-soft:#FFE9EC;

  /* ---- ตัวอักษร 4 ระดับ ---- */
  --fs-display:clamp(28px,7vw,42px);
  --fs-title:21px;
  --fs-body:16px;
  --fs-small:14px;
  /* ---- ระยะห่าง ---- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:32px; --s7:48px; --s8:64px; --s9:88px;

  /* ---- อื่น ๆ ---- */
  --r-sm:14px; --r-md:22px; --r-lg:28px; --r-pill:999px;
  --tap:44px; --tap-sm:40px;
  --wrap:1080px;
  --shadow:0 2px 4px rgba(49,34,77,.04), 0 28px 56px -28px rgba(49,34,77,.3);
  --purple-grad:linear-gradient(160deg,#8F69F5,#6C44E4);
  --coral-grad:linear-gradient(180deg,#FF8896,#FF6D7A);
  --font-head:"Bai Jamjuree","Sarabun",system-ui,sans-serif;
  --font-body:"Sarabun","Noto Sans Thai",system-ui,-apple-system,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);overflow-x:hidden;
  background:
    radial-gradient(900px 640px at -8% -10%, #FFD6DE 0%, rgba(255,214,222,0) 62%),
    radial-gradient(820px 620px at 108% 6%, #D6F6E8 0%, rgba(214,246,232,0) 60%),
    radial-gradient(760px 520px at 60% 112%, #FFF0C4 0%, rgba(255,240,196,0) 62%),
    var(--bg);
  background-attachment:fixed;
  font-family:var(--font-body);
  font-size:var(--fs-body);line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,ul,dl{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:8px}
h1,h2,h3,.logo b,.r-title,.form-title{font-family:var(--font-head);font-weight:500;line-height:1.45}
h1{font-size:var(--fs-display);line-height:1.3;letter-spacing:-.3px;font-weight:600}
h2{font-size:var(--fs-title)}
h3{font-size:var(--fs-body);font-weight:500}
.wrap{width:100%;max-width:var(--wrap);margin:0 auto;padding:0 var(--s4)}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ของตกแต่งพื้นหลัง */
body::before{content:"";display:none;position:fixed;left:-30px;top:280px;width:170px;height:260px;z-index:0;pointer-events:none;opacity:.75;
  background:radial-gradient(circle,#D9C6F2 6px,transparent 7px) 0 0/34px 34px;
  -webkit-mask:radial-gradient(circle at -20% 50%,transparent 42%,#000 44%,#000 70%,transparent 72%);
  mask:radial-gradient(circle at -20% 50%,transparent 42%,#000 44%,#000 70%,transparent 72%)}
body::after{content:"";position:fixed;right:-90px;bottom:-80px;width:280px;height:280px;border-radius:50%;border:22px solid #FFD9DE;opacity:.85;z-index:0;pointer-events:none}
@media(min-width:1240px){body::before{display:block}}
.nav,main,.foot,.toast{position:relative;z-index:1}
.toast{position:fixed}

/* ---------------- ปุ่มทุกชนิดใช้ฐานเดียวกัน ---------------- */
.btn,.btn-main,.btn-line,.btn-sm,.btn-quiet,.btn-danger,.nav-cta{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding:var(--s2) var(--s5);
  border-radius:var(--r-pill);border:1px solid transparent;
  font-family:var(--font-body);font-size:var(--fs-body);font-weight:600;
  line-height:1.3;text-align:center;white-space:nowrap;
}
.btn,.btn-main,.btn-line,.btn-sm,.btn-quiet,.btn-danger,.nav-cta{transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn-main,.btn-sm,.nav-cta{background:var(--coral-grad);color:#FFF;text-shadow:0 1px 0 rgba(49,34,77,.15);box-shadow:0 5px 0 #E0525F,0 16px 26px -12px rgba(255,109,122,.75)}
.btn-main:hover,.btn-sm:hover,.nav-cta:hover{transform:translateY(-2px);box-shadow:0 7px 0 #E0525F,0 20px 30px -12px rgba(255,109,122,.8)}
.btn-main:active,.btn-sm:active,.nav-cta:active{transform:translateY(3px);box-shadow:0 2px 0 #E0525F}
.btn-line,.btn-quiet{background:#FFF;border-color:var(--line-2);color:var(--ink);box-shadow:0 4px 0 var(--line-2)}
.btn-line:hover,.btn-quiet:hover{border-color:#CDB8F5;color:var(--link);transform:translateY(-1px);box-shadow:0 5px 0 #CDB8F5}
.btn-line:active,.btn-quiet:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.btn-danger{background:var(--danger);color:#FFF;box-shadow:0 4px 0 #7E2431}
.btn-danger:hover{background:#9C2F3D}
.btn-sm[disabled],.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn-block{width:100%;display:flex}
.btn-row{display:flex;flex-wrap:wrap;gap:var(--s3)}
.icon-btn{
  display:grid;place-items:center;min-width:var(--tap);min-height:var(--tap);
  border-radius:var(--r-pill);color:var(--ink-2);
}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px;display:block}
.add-slot{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  width:100%;min-height:var(--tap);padding:var(--s2) var(--s4);
  border:1px dashed var(--line-2);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink-2);font-size:var(--fs-small);font-weight:600;
}
.add-slot:hover{color:var(--link);border-color:var(--link)}

/* ---------------- แถบนำทาง ---------------- */
.nav{position:sticky;top:0;z-index:50 !important;background:rgba(255,250,240,.72);backdrop-filter:blur(14px)}
.nav-in{display:flex;align-items:center;gap:var(--s3);min-height:64px}
.logo{display:flex;align-items:center;gap:var(--s2);margin-right:auto}
.logo-mark{width:42px;height:42px;border-radius:14px;flex:0 0 auto;background:var(--coral-grad);display:grid;place-items:center;color:#FFF;box-shadow:0 5px 0 #E0525F,0 12px 20px -10px rgba(255,109,122,.7)}
.logo-mark svg{width:20px;height:20px}
.logo b{font-size:var(--fs-title);font-weight:600;letter-spacing:-.2px}
.nav-links{display:none;gap:var(--s5);align-items:center}
.nav-links a{font-size:var(--fs-small);font-weight:600;color:var(--ink-2);min-height:var(--tap);display:inline-flex;align-items:center}
.nav-links a:hover{color:var(--ink)}
.nav-links a.on{color:var(--link)}
.burger{display:grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface)}
.burger svg{width:20px;height:20px}
.sheet{display:none;border-top:1px solid var(--line);background:var(--surface)}
.sheet.open{display:block}
.sheet a{display:flex;align-items:center;min-height:var(--tap);padding:var(--s3) var(--s4);color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--line)}
.sheet a.on{color:var(--link)}
@media(min-width:860px){.nav-links{display:flex}.burger{display:none}.sheet{display:none !important}}

.save-chip{
  display:inline-flex;align-items:center;gap:var(--s2);
  font-size:var(--fs-small);color:var(--ink-2);
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-pill);padding:var(--s1) var(--s3);min-height:36px;white-space:nowrap;
}
.save-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.save-chip[data-state=saved] .dot{background:var(--primary)}
.save-chip[data-state=error]{border-color:var(--danger);color:var(--danger)}
.save-chip[data-state=error] .dot{background:var(--danger)}
.save-chip[data-state=saving] .dot,.save-chip[data-state=loading] .dot{background:var(--secondary-ink)}
.save-chip .label{display:none}
@media(min-width:600px){.save-chip .label{display:inline}}

/* ---------------- โครงหน้า ---------------- */
.page{padding:var(--s6) 0 var(--s8)}
.page-head{max-width:640px;margin-bottom:var(--s6)}
.page-head p{margin-top:var(--s3);color:var(--ink-2)}
.crumb{display:inline-flex;align-items:center;min-height:var(--tap);font-size:var(--fs-small);font-weight:600;color:var(--ink-2)}
.crumb:hover{color:var(--link)}
section+section{margin-top:var(--s8)}
.sec-head{max-width:620px;margin-bottom:var(--s5)}
.sec-head p{margin-top:var(--s3);color:var(--ink-2)}

/* ---------------- hero ---------------- */
.hero{padding:var(--s6) 0 var(--s8)}
.hero-grid{display:grid;gap:var(--s7)}
.hero .lede{margin-top:var(--s4);color:var(--ink-2);max-width:34em}
.hero .btn-row{margin-top:var(--s5)}
.hero .note{margin-top:var(--s4);font-size:var(--fs-small);color:var(--ink-2)}
.hero .note{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.hero-steps{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.hero-steps span{display:inline-flex;align-items:center;gap:var(--s2);background:#FFF;border:1.5px solid var(--line);border-radius:var(--r-pill);padding:var(--s1) var(--s4) var(--s1) var(--s1);min-height:44px;font-size:var(--fs-small);font-weight:600;color:var(--ink-2);box-shadow:0 3px 0 var(--line-2)}
.hero-steps b{width:30px;height:30px;border-radius:50%;background:var(--purple-grad);color:#FFF;display:grid;place-items:center;font-family:var(--font-num);font-size:13px;font-weight:600}
.hero-art{position:relative;padding:var(--s6) var(--s4)}
.hero-art::before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:#FFE7A3;top:-10px;right:-10px;z-index:0}
.hero-art .receipt-wrap{position:relative;z-index:1}
.blob{position:absolute;display:grid;place-items:center;color:#FFF;z-index:2;font-family:var(--font-head);font-weight:600;font-size:22px;line-height:1}
.blob.purple{width:58px;height:58px;border-radius:18px;background:var(--purple-grad);box-shadow:0 6px 0 #5533C4,0 14px 22px -10px rgba(112,72,232,.6);top:-8px;right:-6px}
.blob.coral{width:46px;height:46px;border-radius:50%;background:var(--coral-grad);box-shadow:0 5px 0 #E0525F,0 12px 20px -10px rgba(255,109,122,.6);top:120px;left:-8px;font-size:20px}
.blob.mint{width:54px;height:54px;border-radius:16px;background:linear-gradient(160deg,#5EDCB0,#3DBF92);box-shadow:0 6px 0 #2C9B75,0 14px 22px -10px rgba(61,191,146,.6);bottom:30px;right:-6px}
.blob svg{width:26px;height:26px}
@media(prefers-reduced-motion:no-preference){
  .blob{animation:floaty 4.5s ease-in-out infinite}
  .blob.coral{animation-delay:-1.5s}
  .blob.mint{animation-delay:-3s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
}
@media(min-width:900px){.hero-grid{grid-template-columns:1.05fr .95fr;align-items:center;gap:var(--s8)}.hero{padding:var(--s8) 0}
  .blob.purple{top:-24px}}
@media(min-width:1240px){.blob.purple{right:-36px}.blob.coral{left:-40px}.blob.mint{right:-40px}}

/* ---------------- ใบเสร็จ ---------------- */
.receipt-wrap{position:relative;max-width:390px;margin:0 auto;width:100%}
.receipt{
  background:var(--paper);color:var(--ink);
  border:1px solid var(--line);border-bottom:none;border-radius:var(--s1) var(--s1) 0 0;
  padding:var(--s5) var(--s4) var(--s4);box-shadow:var(--shadow);
}
.receipt-edge{height:11px;background:
  linear-gradient(-45deg,var(--paper) 50%,transparent 50%) 0 0/14px 11px repeat-x,
  linear-gradient(45deg,var(--paper) 50%,transparent 50%) 0 0/14px 11px repeat-x}
.r-title{display:table;margin:0 auto;background:var(--secondary);color:var(--secondary-ink);border-radius:var(--r-pill);padding:var(--s1) var(--s4);font-family:var(--font-body);font-size:var(--fs-small);font-weight:600;letter-spacing:.2px}
.eyebrow{font-size:var(--fs-small);font-weight:700;color:var(--link);margin-bottom:var(--s2)}
.spark{display:inline-flex;align-items:center;gap:var(--s1);background:#FFF6C9;color:var(--spark-ink);border:1.5px solid #E8CF6B;border-radius:var(--r-pill);padding:var(--s2) var(--s4);font-size:var(--fs-small);font-weight:600;box-shadow:0 4px 0 #E8CF6B}
.r-meta{text-align:center;font-size:var(--fs-small);color:var(--ink-2);margin:var(--s2) 0 var(--s4)}
.r-line{
  width:100%;display:flex;align-items:center;gap:var(--s2);
  padding:var(--s2) 0;min-height:var(--tap);
  border-bottom:1px dashed var(--line-2);font-size:var(--fs-small);text-align:left;color:inherit;
}
.r-line .caret{font-size:var(--fs-small);color:var(--ink-2);flex:0 0 auto}
.r-line[aria-expanded=true] .caret{transform:rotate(90deg)}
.r-line .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-line .val{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}
.r-detail{font-size:var(--fs-small);color:var(--ink-2);padding:var(--s2) 0 var(--s3) var(--s3);border-bottom:1px dashed var(--line-2)}
.r-detail div{display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s1) 0}
.r-detail span:last-child{font-family:var(--font-num)}
.r-sum{margin-top:var(--s4);font-size:var(--fs-small);color:var(--ink-2)}
.r-sum div{display:flex;justify-content:space-between;padding:var(--s1) 0}
.r-sum span:last-child{font-family:var(--font-num)}
.r-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:var(--s3);padding-top:var(--s3);border-top:2px solid var(--ink);
  font-family:var(--font-head);font-size:var(--fs-title);font-weight:500;
}
.r-total span:last-child{font-family:var(--font-num);font-weight:600}
.barcode{display:flex;gap:1.5px;align-items:flex-end;height:26px;margin-top:var(--s4);overflow:hidden;opacity:.8}
.barcode i{background:var(--ink);display:block}

/* ---------------- บล็อกบนหน้าแรก ---------------- */
.compare{display:grid;gap:var(--s4)}
@media(min-width:720px){.compare{grid-template-columns:1fr 1fr;gap:var(--s5)}}
.cmp{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);background:var(--surface);box-shadow:var(--shadow)}
.cmp.bad{background:var(--secondary-soft);border-color:#F1E2A6}
.cmp.good{background:var(--primary-soft);border-color:#C6F0DE}
.cmp .tag{font-size:var(--fs-small);color:var(--ink-2);margin-top:var(--s1)}
.cmp ul{margin-top:var(--s4);border-top:1px solid var(--line-2)}
.cmp li{display:flex;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line-2);font-size:var(--fs-small)}
.cmp li span:last-child{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}
.cmp.bad li span:last-child{color:var(--secondary-ink)}
.cmp.good li span:last-child{color:var(--primary-ink)}
.cmp .foot{margin-top:var(--s4);font-size:var(--fs-small);color:var(--ink-2)}

.bill-list{border-top:1px solid var(--line)}
.bill-list li{display:flex;align-items:flex-start;gap:var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.bill-list .k{font-family:var(--font-num);font-size:var(--fs-small);color:var(--primary-ink);padding-top:var(--s1);flex:0 0 34px}
.bill-list p{margin-top:var(--s1);color:var(--ink-2);font-size:var(--fs-small);max-width:52em}

.steps{display:grid;gap:var(--s4)}
@media(min-width:720px){.steps{grid-template-columns:repeat(4,1fr)}}
.stp{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s5);background:var(--surface);box-shadow:var(--shadow)}
.stp b{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--purple-grad);color:#FFF;font-family:var(--font-num);font-size:var(--fs-small);font-weight:600;box-shadow:0 4px 0 #5533C4}
.stp h3{margin-top:var(--s3)}
.stp p{margin-top:var(--s2);color:var(--ink-2);font-size:var(--fs-small)}

.cta-box{border:1px solid #E6D9FF;border-radius:var(--r-lg);padding:var(--s7) var(--s5);text-align:center;background:linear-gradient(160deg,#FFFFFF,var(--link-soft));box-shadow:var(--shadow)}
.cta-box p{margin-top:var(--s3);color:var(--ink-2);max-width:44em;margin-inline:auto}
.cta-box .btn-row{justify-content:center;margin-top:var(--s5)}

.split2{display:grid;gap:var(--s4)}
@media(min-width:760px){.split2{grid-template-columns:1fr 1fr;gap:var(--s5)}}
.panel{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s5);background:var(--surface);box-shadow:var(--shadow)}
.panel h3{margin-bottom:var(--s3)}
.panel p{color:var(--ink-2);font-size:var(--fs-small)}
.dl div{display:flex;gap:var(--s3);padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--fs-small)}
.dl div:last-child{border-bottom:none}
.dl dt{color:var(--ink-2);flex:0 0 96px}
.dl dd{margin:0;flex:1}

/* ---------------- หน้าแอป ---------------- */
.app-col{max-width:540px;margin:0 auto}
.step-card{position:relative;background:#FFF;border:1px solid rgba(255,255,255,.9);border-radius:var(--r-md);padding:var(--s5) var(--s4);margin-top:var(--s2);margin-bottom:var(--s4);box-shadow:var(--shadow)}
.step-card::before{content:"";position:absolute;top:-7px;right:44px;width:88px;height:9px;border-radius:5px 5px 0 0;background:var(--coral-grad)}
.step-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.step-num{position:relative;width:38px;height:38px;border-radius:12px;flex:0 0 auto;background:var(--purple-grad);color:#FFF;font-family:var(--font-num);font-size:var(--fs-small);font-weight:600;display:grid;place-items:center;box-shadow:0 4px 0 #5533C4}
.step-num::after{content:"";position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;border-radius:50%;background:#FFD54A;border:2px solid #FFF}
.step-head h2{font-size:var(--fs-title);font-weight:600}
.step-head .aside{margin-left:auto;text-align:right;font-size:var(--fs-small);color:var(--ink-2);line-height:1.4}
.hint{font-size:var(--fs-small);color:var(--ink-2);margin-bottom:var(--s3)}
.sub-head{font-size:var(--fs-small);color:var(--ink-2);margin:var(--s4) 0 var(--s2);font-weight:600}

input[type=text],input[type=number]{
  width:100%;background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);
  color:var(--ink);font-family:var(--font-body);font-size:var(--fs-body);
  padding:var(--s2) var(--s4);min-height:48px;transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 4px rgba(112,72,232,.14)}
input::placeholder{color:var(--ink-3)}
input[type=number]{font-family:var(--font-num);-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[aria-invalid=true]{border-color:var(--danger);background:var(--danger-soft)}
.field-row{display:flex;gap:var(--s2);align-items:flex-start}
.field-row>div{flex:1;min-width:0}
.field-msg{font-size:var(--fs-small);margin-top:var(--s1);min-height:20px;line-height:1.45}
.field-msg.error{color:var(--danger)}
.field-msg.muted{color:var(--ink-2)}

.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(49,34,77,.25);border-top-color:var(--on-primary);flex:0 0 auto}
@media(prefers-reduced-motion:no-preference){
  .spinner{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
}

/* สมาชิก */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chip{
  display:inline-flex;align-items:center;gap:var(--s1);
  background:var(--primary-soft);border:1.5px solid #B9EBD4;border-radius:var(--r-pill);box-shadow:0 3px 0 #B9EBD4;
  padding:0 var(--s1) 0 var(--s4);min-height:48px;
  font-size:var(--fs-small);font-weight:600;color:var(--primary-ink);
}
.chip .nm{max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .act{width:var(--tap-sm);height:var(--tap-sm);border-radius:50%;display:grid;place-items:center;color:var(--primary-ink)}
.chip .act:hover{background:rgba(14,85,64,.12)}
.chip .act.del:hover{background:var(--danger-soft);color:var(--danger)}
.chip .act svg{width:16px;height:16px}
.chip.editing{background:var(--surface);border-color:var(--line-2);padding:var(--s1);gap:var(--s2)}
.chip.editing input{min-height:var(--tap-sm);padding:var(--s1) var(--s2);font-size:var(--fs-small);width:9em}
.chip .count{font-family:var(--font-num);font-size:var(--fs-small);opacity:.8}

.skeleton{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.skeleton i{display:block;height:48px;width:96px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--line)}
.skeleton i:nth-child(2){width:118px}
.skeleton i:nth-child(3){width:84px}
@media(prefers-reduced-motion:no-preference){
  .skeleton i{animation:pulse 1.25s ease-in-out infinite}
  .skeleton i:nth-child(2){animation-delay:.12s}
  .skeleton i:nth-child(3){animation-delay:.24s}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
}

.notice{border-radius:var(--r-sm);padding:var(--s3);font-size:var(--fs-small);margin-top:var(--s3);display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.notice p{flex:1;min-width:12em;margin:0}
.notice.error{background:var(--danger-soft);border:1px solid #F1CFC6;color:var(--danger)}
.notice.warn{background:var(--secondary-soft);border:1px solid #F1E2A6;color:var(--secondary-ink)}
.notice .btn-quiet{background:transparent;border-color:currentColor;color:inherit;font-size:var(--fs-small);padding:var(--s2) var(--s4)}
.confirm{border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s4);margin-top:var(--s3)}
.confirm p{font-size:var(--fs-small);color:var(--ink-2);margin-top:var(--s1)}
.confirm .btn-row{margin-top:var(--s4)}
.confirm .btn-row>*{flex:1}

/* แถวรายการ */
.row-item{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2);margin-bottom:var(--s2);display:flex;align-items:center;gap:var(--s2)}
.row-item .body{flex:1;min-width:0}
.row-item .name{display:block;font-size:var(--fs-body);font-weight:600}
.row-item .sub{display:block;font-size:var(--fs-small);color:var(--ink-2);word-break:break-word;line-height:1.5}
.row-item .amt{font-family:var(--font-num);font-size:var(--fs-body);font-weight:600;white-space:nowrap}
.row-item .acts{display:flex;gap:var(--s1);flex:0 0 auto}
.row-item.warn{border-color:#E9C0B4;background:var(--danger-soft)}
.row-item.warn .sub{color:var(--danger)}
.row-item.editing{border-color:var(--primary-ink);background:var(--primary-soft)}
.row-tap{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);text-align:left;border-radius:var(--r-sm);padding:0 var(--s2);color:inherit}
.row-tap .body{flex:1;min-width:0}
.row-tap:hover .name{color:var(--primary-ink)}

.form-box{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:var(--s3);display:grid;gap:var(--s2);background:var(--surface)}
.form-box .label{font-size:var(--fs-small);color:var(--ink-2);font-weight:600}
.form-box .field-msg{margin-top:var(--s1)}
.form-title{font-size:var(--fs-body);color:var(--ink)}
.form-preview{font-size:var(--fs-small);color:var(--primary-ink);font-weight:600;min-height:20px;margin:0}
.form-actions{display:flex;gap:var(--s2)}
.form-actions button{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.pick button{
  border:1px solid var(--line-2);border-radius:var(--r-pill);
  padding:var(--s2) var(--s4);min-height:var(--tap);
  font-size:var(--fs-small);font-weight:600;color:var(--ink-2);background:var(--surface);
}
.pick button{box-shadow:0 3px 0 var(--line-2);transition:transform .12s,box-shadow .12s}
.pick button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.pick button[aria-pressed=true]{background:var(--purple-grad);border-color:transparent;color:#FFF;box-shadow:0 3px 0 #5533C4}
.pick .all{border-style:dashed}
.empty{border:1px dashed #E6D9FF;border-radius:var(--r-sm);padding:var(--s5) var(--s4);text-align:center;color:var(--ink-3);font-size:var(--fs-small);background:var(--link-soft)}
.app-foot{display:flex;gap:var(--s2);justify-content:center;margin-top:var(--s5);flex-wrap:wrap}
.app-foot button,.app-foot a{font-size:var(--fs-small);font-weight:600;color:var(--ink-2);padding:var(--s2) var(--s4);min-height:var(--tap);display:inline-flex;align-items:center;border-radius:var(--r-pill)}
.app-foot button:hover,.app-foot a:hover{color:var(--ink);background:var(--surface)}

/* กล่องเมนูแนะนำ (v1.4) */
.suggest{margin-top:var(--s1);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.suggest .s-head{font-size:var(--fs-small);font-weight:600;color:var(--ink-2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);background:var(--surface-2)}
.suggest button{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--tap);padding:var(--s2) var(--s3);text-align:left;font-size:var(--fs-small);border-bottom:1px solid var(--line);color:var(--ink)}
.suggest button:last-child{border-bottom:none}
.suggest button:hover,.suggest button[aria-selected=true]{background:var(--primary-soft);color:var(--primary-ink)}
.suggest .s-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggest .s-name b{color:var(--primary-ink);font-weight:600}
.suggest .s-price{font-family:var(--font-num);color:var(--ink-2);white-space:nowrap}
.suggest .s-tag{font-size:var(--fs-small);font-weight:600;color:var(--primary-ink);background:var(--primary-soft);border-radius:var(--r-pill);padding:0 var(--s2);white-space:nowrap}

/* ---------------- ท้ายหน้า / ข้อความเด้ง ---------------- */
.foot{border-top:1px solid rgba(49,34,77,.08);padding:var(--s6) 0;margin-top:var(--s8);color:var(--ink-2);font-size:var(--fs-small)}
.foot-in{display:flex;flex-wrap:wrap;gap:var(--s4);justify-content:space-between;align-items:center}
.foot nav{display:flex;gap:var(--s2);flex-wrap:wrap}
.foot nav a{min-height:var(--tap);display:inline-flex;align-items:center;padding:0 var(--s2);font-weight:600}
.foot a:hover{color:var(--link)}

.toast{
  position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:var(--s3);
  background:var(--ink);color:#FFF;font-size:var(--fs-small);
  padding:var(--s2) var(--s2) var(--s2) var(--s5);border-radius:var(--r-pill);
  box-shadow:0 12px 32px -12px rgba(35,48,43,.55);
  opacity:0;pointer-events:none;max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;pointer-events:auto}
.toast[data-kind=error]{background:var(--danger)}
.toast .msg{flex:1;min-width:0}
.toast button{background:rgba(255,255,255,.2);color:#FFF;font-weight:600;border-radius:var(--r-pill);padding:0 var(--s4);min-height:var(--tap-sm);white-space:nowrap}
.toast button:hover{background:rgba(255,255,255,.32)}
@media(prefers-reduced-motion:no-preference){
  .toast{transition:opacity .18s ease}
  .r-line .caret{transition:transform .15s ease}
  .reveal .r-line,.reveal .r-sum,.reveal .r-total{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .reveal .r-line:nth-child(4){animation-delay:.05s}
  .reveal .r-line:nth-child(5){animation-delay:.1s}
  .reveal .r-line:nth-child(6){animation-delay:.15s}
  .reveal .r-line:nth-child(7){animation-delay:.2s}
  .reveal .r-sum{animation-delay:.26s}
  .reveal .r-total{animation-delay:.32s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>
"use strict";

/* =========================================================
   1. ชั้นเก็บข้อมูล — เลือกที่เก็บที่ใช้ได้จริงในสภาพแวดล้อมนั้น
   ========================================================= */
var Store = {
  key: "fairdish:bill:v1",
  menuKey: "fairdish:menu-memory:v1",   // คีย์ใหม่ ไม่ทับข้อมูลบิลที่เคยบันทึกไว้
  mode: "memory",
  mem: null,
  memStore: {},
  async init(){
    try {
      if (window.storage && typeof window.storage.get === "function"){ this.mode = "artifact"; return; }
    } catch(e){}
    try {
      var probe = "__fairdish_probe__";
      window.localStorage.setItem(probe,"1");
      window.localStorage.removeItem(probe);
      this.mode = "local";
    } catch(e){ this.mode = "memory"; }
  },
  async readRaw(key){
    if (this.mode === "artifact"){
      try {
        var res = await window.storage.get(key);
        return res && res.value ? res.value : null;
      } catch(e){ return null; }            // ยังไม่เคยมีข้อมูล = ไม่ใช่ข้อผิดพลาด
    }
    if (this.mode === "local") return window.localStorage.getItem(key);
    return this.memStore[key] || null;
  },
  async writeRaw(key, text){
    if (this.mode === "artifact"){
      var res = await window.storage.set(key, text);
      if (!res) throw new Error("storage rejected");
      return;
    }
    if (this.mode === "local"){ window.localStorage.setItem(key, text); return; }
    this.memStore[key] = text;
  },
  async load(){
    var raw = await this.readRaw(this.key);
    return raw ? JSON.parse(raw) : null;
  },
  async save(data){
    var text = JSON.stringify(data);
    await this.writeRaw(this.key, text);
    this.mem = JSON.parse(text);
  },
  async loadMenus(){
    var raw = await this.readRaw(this.menuKey);
    var list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  },
  async saveMenus(list){
    await this.writeRaw(this.menuKey, JSON.stringify(list));
  }
};

/* =========================================================
   2. ข้อมูลของบิล
   ========================================================= */
var uid = 0;
function nid(){ uid += 1; return "i" + uid; }

var state = {
  members: [],
  menus: [],
  shared: [],
  charges: [
    { id:"svc", label:"ค่าบริการ", rate:10, on:false, fixed:true },
    { id:"vat", label:"VAT", rate:7, on:false, fixed:true }
  ],
  menuMemory: [],
  menuForm:null, sharedForm:null, chargeForm:null, open:{}
};

var ui = {
  loading:true,
  save:"loading",
  savingMember:false,
  memberError:"",
  editingMember:null,
  editError:"",
  confirmMember:null,
  savingMenu:false,
  menuErr:{},
  suggest:{ open:false, items:[], active:-1, total:0 },
  focusMenuField:null,
  saveFailedIn:null,
  undo:null,
  undoTimer:null,
  confirmReset:false
};

var MAX_NAME = 24;
var MAX_MENU_NAME = 40;
var MAX_PRICE = 100000;
function normText(x){ return String(x||"").toLowerCase().replace(/\s+/g,""); }
var APP_VERSION = "1.9";
var MENU_MEMORY_LIMIT = 60;

/* ---- คลังเมนู ----
   สร้างจาก "ตระกูลอาหาร × วัตถุดิบ" แบบที่ร้านไทยตั้งชื่อจริง ได้เกิน 1,000 รายการ
   โดยไฟล์ไม่บวม */
var TAM = ["ไทย","ไทยไข่เค็ม","ปูปลาร้า","ปูม้า","ปลาร้า","ลาวไข่เค็ม","ซั่ว","ถาด","หมูยอ","ไข่เค็ม",
"กุ้งสด","คอหมูย่าง","แคบหมู","ผลไม้","แตง","ข้าวโพด","มะม่วง","ถั่วฝักยาว","หอยดอง","ซีฟู้ด",
"ปลากระป๋อง","ไทยกุ้งสด","ป่า","มั่ว","ปูดอง","หอยแมลงภู่","ไข่ดาว","ปลาทู","กุ้งดอง","ซั่วไข่เค็ม"];
var LAAB = ["หมู","หมูคั่ว","หมูกรอบ","เนื้อ","เนื้อคั่ว","ไก่","เป็ด","ปลาดุก","ปลา","ทะเล","หมูยอ","เห็ด","ปลาทู","เลือด","ไก่คั่ว","ปลาคัง","หมูสามชั้น","อีสาน"];
var YAM = ["วุ้นเส้น","หมูยอ","ไข่ดาว","ทะเล","มาม่า","ปลากระป๋อง","แซลมอน","หัวปลี","ถั่วพู","ปูอัด",
"กุนเชียง","หมูมะนาว","ปลาดุกฟู","ตะไคร้","ไส้กรอก","สามกรอบ","เห็ดรวม","คะน้ากรอบ","ไข่เค็ม","แหนมสด","กุ้งสด","หอยแครง","เนื้อย่าง","รวมมิตรทะเล"];
var MENU_FAMILIES = [
  { base:"ส้มตำ", variants:TAM },
  { base:"ตำ", variants:TAM },
  { base:"ลาบ", variants:LAAB },
  { base:"น้ำตก", variants:["หมู","เนื้อ","ไก่","คอหมู","หมูย่าง","เนื้อย่าง"] },
  { base:"ก้อย", variants:["เนื้อ","หมู","กุ้ง","ปลา","หอย","ไก่"] },
  { base:"ต้มแซ่บ", variants:["กระดูกอ่อน","ซี่โครงหมู","เนื้อ","ขาหมู","กระดูกหมู","ไก่","ปลา","เอ็นเนื้อ","ปลาดุก"] },
  { base:"ต้มยำ", variants:["กุ้ง","กุ้งน้ำข้น","ทะเล","ไก่","ไก่บ้าน","ปลา","ปลากะพง","ปลาหมึก","หม้อไฟ","เห็ด","ปลาคัง","ขาหมู","ปลาทู","รวมมิตร","แซลมอน"] },
  { base:"ต้มข่า", variants:["ไก่","กุ้ง","ทะเล","เห็ด","ปลา","หมู"] },
  { base:"ต้มจืด", variants:["เต้าหู้หมูสับ","วุ้นเส้น","ฟักหมูสับ","ผักกาดขาว","มะระยัดไส้","สาหร่าย","ตำลึง","เกี๊ยวหมู"] },
  { base:"แกงเขียวหวาน", variants:["ไก่","หมู","เนื้อ","ลูกชิ้นปลา","ทะเล","หน่อไม้"] },

function buildMenuLibrary(){
  var out = [], seen = {};
  function add(name){
    var n = normText(name);
    if (!n || seen[n]) return;
    seen[n] = true;
    out.push({ name:name, norm:n });
  }
  MENU_FAMILIES.concat(METHOD_FAMILIES).forEach(function(f){
    add(f.base);
    f.variants.forEach(function(v){ add(f.base+v); });
  });
  MENU_SINGLES.concat(EXTRA_SINGLES).forEach(function(g){
    g.names.forEach(function(n){ add(n); });
  });
  return out;
}

   ========================================================= */
function compute(){
  var n = state.members.length;
  var known = {};
  state.members.forEach(function(p){ known[p.id] = true; });

  var cleaned = state.menus.map(function(m){
    return { id:m.id, name:m.name, price:m.price, eaters:m.eaters.filter(function(id){ return known[id]; }) };
  });
  var valid = cleaned.filter(function(m){ return m.eaters.length > 0; });
  var orphan = cleaned.length - valid.length;

  var per = {};
  state.members.forEach(function(p){
    per[p.id] = { id:p.id, name:p.name, food:0, items:[], sharedShare:0, charge:0, total:0, rounded:0 };
  });
  valid.forEach(function(m){
    var each = m.price / m.eaters.length;
    m.eaters.forEach(function(pid){
      if (!per[pid]) return;
      per[pid].food += each;
      per[pid].items.push({ name:m.name, amount:each, split:m.eaters.length });
    });
  });

  var foodTotal = valid.reduce(function(a,m){ return a+m.price; },0);
  var sharedTotal = state.shared.reduce(function(a,s){ return a+s.price; },0);
  var sharedEach = n>0 ? sharedTotal/n : 0;
  var rate = state.charges.reduce(function(a,c){ return a+(c.on?c.rate:0); },0)/100;

  var list = state.members.map(function(p){
    var row = per[p.id];
    row.sharedShare = sharedEach;
    var base = row.food + sharedEach;
    row.charge = base*rate;
    row.total = base + row.charge;
    return row;
  });

  var chargeTotal = (foodTotal + sharedTotal) * rate;
  var grand = foodTotal + sharedTotal + chargeTotal;

  var target = Math.round(grand*100);
  var cents = list.map(function(r){ return Math.floor(r.total*100 + 1e-7); });
  var diff = target - cents.reduce(function(a,b){ return a+b; },0);
  var order = list.map(function(r,i){
    return { i:i, frac: r.total*100 - Math.floor(r.total*100 + 1e-7) };
  }).sort(function(a,b){ return b.frac - a.frac; });
  var k=0;
  while (diff>0 && order.length>0){ cents[order[k % order.length].i]+=1; diff-=1; k+=1; }
  k=0;
  while (diff<0 && order.length>0){ cents[order[order.length-1-(k % order.length)].i]-=1; diff+=1; k+=1; }
  list.forEach(function(r,i){ r.rounded = cents[i]/100; });

  return { list:list, foodTotal:foodTotal, sharedTotal:sharedTotal, chargeTotal:chargeTotal,
           grand:Math.round(grand*100)/100, rate:rate, orphan:orphan, n:n };
}
function hasData(){ return state.members.length>0 && (state.menus.length + state.shared.length)>0; }

function barcode(seed){
  var bars="", x = Math.max(1, Math.round(seed*100)) % 9973;
  for (var i=0;i<46;i++){
    x = (x*1103515245 + 12345) % 2147483648;
    bars += '<i style="width:'+(1+(x%4))+'px;height:'+(60+(x%41))+'%"></i>';
  }
  return '<div class="barcode" aria-hidden="true">'+bars+'</div>';
}
function receiptHTML(r, opts){

      + '<span class="who">'+esc(p.name)+'</span><span class="val">'+baht(p.rounded)+'</span>'

    if (opts.interactive && opened){

        return '<div><span class="dname">'+esc(it.name)+' ÷ '+it.split+'</span><span>'+baht(it.amount)+'</span></div>';

      if (p.items.length===0) d = '<div><span class="dname">ไม่ได้สั่งเมนูส่วนตัว</span><span>0.00</span></div>';
      if (r.sharedTotal>0) d += '<div><span class="dname">ค่าส่วนกลาง ÷ '+r.n+'</span><span>'+baht(p.sharedShare)+'</span></div>';
      if (r.rate>0) d += '<div><span class="dname">ค่าบริการ + ภาษี '+(r.rate*100).toFixed(0)+'%</span><span>'+baht(p.charge)+'</span></div>';

  }).join("");

  if (r.sharedTotal>0) sums += '<div><span>ค่าส่วนกลาง</span><span>'+baht(r.sharedTotal)+'</span></div>';
  if (r.chargeTotal>0) sums += '<div><span>ค่าบริการ + ภาษี</span><span>'+baht(r.chargeTotal)+'</span></div>';

  return '<div class="receipt-wrap'+(opts.reveal?' reveal':'')+'"><div class="receipt">'+

    '<div class="r-meta">'+r.n+' คน · '+r.list.reduce(function(a,p){return a+p.items.length;},0)+' รายการที่แบ่งกัน</div>'+
    lines+

    '<div class="r-total"><span>รวมทั้งหมด</span><span>'+baht(r.grand)+' ฿</span></div>'+
    barcode(r.grand)+
  '</div><div class="receipt-edge"></div></div>';
}

/* ---- ฟีเจอร์ที่ 1: จัดการสมาชิก ---- */
function renderMembers(){
  var box = document.getElementById("memberList");
  var extra = document.getElementById("memberExtra");
  var count = document.getElementById("memberCount");
  var input = document.getElementById("memberInput");
  var addBtn = document.getElementById("memberAdd");
  var msg = document.getElementById("memberMsg");
  if (!box) return;

  if (count) count.textContent = state.members.length ? state.members.length + " คนในโต๊ะ" : "";
  if (addBtn){
    addBtn.disabled = ui.savingMember;
    addBtn.innerHTML = ui.savingMember ? '<span class="spinner" aria-hidden="true"></span>กำลังบันทึก' : "เพิ่ม";
  }
  if (input) input.setAttribute("aria-invalid", ui.memberError ? "true" : "false");
  if (msg){
    msg.className = "field-msg " + (ui.memberError ? "error" : "muted");
    msg.textContent = ui.memberError
      || (state.members.length ? "แตะดินสอเพื่อแก้ชื่อ หรือกากบาทเพื่อลบออก"
                               : "ใส่ได้ทั้งชื่อจริงและชื่อเล่น สั้น ๆ อ่านง่ายที่สุด");
  }

  if (ui.loading){
    box.innerHTML = '<div class="skeleton" aria-hidden="true"><i></i><i></i><i></i></div>';
    if (extra) extra.innerHTML = "";
    return;
  }

  if (state.members.length === 0){
    box.innerHTML = '<p class="empty" style="margin-top:var(--s3)">ยังไม่มีใครในโต๊ะ — ใส่ชื่อคนแรกได้เลย</p>';
  } else {
    box.innerHTML = '<div class="chips">' + state.members.map(function(p){
      if (ui.editingMember === p.id){
        return '<span class="chip editing">'+
          '<label class="sr-only" for="editMemberInput">แก้ชื่อ '+esc(p.name)+'</label>'+
          '<input type="text" id="editMemberInput" value="'+esc(p.name)+'" maxlength="'+MAX_NAME+'" autocomplete="off">'+
          '<button class="act" data-save-member="'+p.id+'" aria-label="บันทึกชื่อใหม่">✓</button>'+
          '<button class="act del" data-cancel-edit="1" aria-label="ยกเลิกการแก้ชื่อ">'+ICON_X+'</button>'+
        '</span>';
      }
      var eaten = menusOf(p.id).length;
      return '<span class="chip">'+
        '<span class="nm">'+esc(p.name)+'</span>'+
        (eaten ? '<span class="count" title="อยู่ใน '+eaten+' เมนู">'+eaten+'</span>' : '')+
        '<button class="act" data-edit-member="'+p.id+'" aria-label="แก้ชื่อ '+esc(p.name)+'">'+ICON_EDIT+'</button>'+
        '<button class="act del" data-del-member="'+p.id+'" aria-label="ลบ '+esc(p.name)+'">'+ICON_X+'</button>'+
      '</span>';
    }).join("") + '</div>';
  }

  if (!extra) return;
  var html = "";
  if (ui.editError) html += '<div class="notice error"><p>'+esc(ui.editError)+'</p></div>';
  if (ui.save === "error" && ui.saveFailedIn !== "menu") html += saveErrorNotice();
  if (ui.confirmMember){
    var m = state.members.filter(function(p){ return p.id === ui.confirmMember; })[0];
    if (m){
      var n = menusOf(m.id).length;
      html += '<div class="confirm" role="alertdialog" aria-label="ยืนยันการลบสมาชิก">'+
        '<h3>ลบ '+esc(m.name)+' ออกจากโต๊ะ?</h3>'+
        '<p>'+esc(m.name)+' อยู่ใน '+n+' เมนู ระบบจะนำชื่อออกจากเมนูเหล่านั้นแล้วคิดยอดใหม่ให้เฉพาะคนที่เหลือ</p>'+
        '<div class="btn-row"><button class="btn-quiet" data-cancel-del="1">ยกเลิก</button>'+
        '<button class="btn-danger" data-confirm-del="'+m.id+'">ลบออก</button></div></div>';
    }
  }
  extra.innerHTML = html;
}

function renderMenus(){
  var list = document.getElementById("menuList");
  var slot = document.getElementById("menuFormSlot");
  var meta = document.getElementById("menuMeta");
  if (!list || !slot) return;

  if (ui.loading){
    if (meta) meta.textContent = "";
    list.innerHTML = '<div class="skeleton" aria-hidden="true"><i style="width:100%"></i></div>';
    slot.innerHTML = "";
    return;
  }

  var total = state.menus.reduce(function(a,m){ return a+m.price; },0);
  if (meta) meta.innerHTML = state.menus.length
    ? state.menus.length+' เมนู<br>รวม '+baht(total)+' บาท'
    : 'ใส่ราคาต่อจาน<br>แล้วเลือกคนที่กินเมนูนั้น';

  if (state.menus.length===0 && !state.menuForm){
    list.innerHTML = '<p class="empty">ยังไม่มีเมนู — เพิ่มจานแรกแล้วเลือกว่าใครกิน</p>';
  } else {
    list.innerHTML = state.menus.map(function(m){
      var known = m.eaters.filter(function(id){ return !!nameOf(id); });
      var who = known.length
        ? known.map(function(id){ return esc(nameOf(id)); }).join(" · ")+' · คนละ '+baht(m.price/known.length)
        : "ยังไม่ได้เลือกคนกิน — เมนูนี้ยังไม่ถูกนำไปคำนวณ";
      var editing = state.menuForm && state.menuForm.id===m.id;
      return '<div class="row-item'+(known.length?"":" warn")+(editing?" editing":"")+'">'+
        '<button class="row-tap" data-edit-menu="'+m.id+'" aria-label="แก้ไข '+esc(m.name)+'">'+
          '<span class="body"><span class="name">'+esc(m.name)+'</span><span class="sub">'+who+'</span></span>'+
          '<span class="amt">'+baht(m.price)+'</span>'+
        '</button>'+
        '<span class="acts">'+
          '<button class="icon-btn" data-dup-menu="'+m.id+'" aria-label="เพิ่ม '+esc(m.name)+' อีกจาน">'+ICON_COPY+'</button>'+
          '<button class="icon-btn" data-del-menu="'+m.id+'" aria-label="ลบ '+esc(m.name)+'">'+ICON_DEL+'</button>'+
        '</span></div>';
    }).join("");
  }

  var notice = (ui.save === "error" && ui.saveFailedIn === "menu") ? saveErrorNotice() : "";

  if (!state.menuForm){
    slot.innerHTML = '<button class="add-slot" id="menuOpen">+ เพิ่มเมนู</button>'+notice;
    return;
  }

  var f = state.menuForm;
  var e = ui.menuErr || {};
  var all = state.members.length>0 && f.eaters.length===state.members.length;
  var picks = state.members.length
    ? '<div class="pick"><button class="all" data-eat-all="1" aria-pressed="'+all+'">ทุกคน</button>'+
      state.members.map(function(p){
        return '<button data-eat="'+p.id+'" aria-pressed="'+(f.eaters.indexOf(p.id)>=0)+'">'+esc(p.name)+'</button>';
      }).join("")+'</div>'
    : '';
  var preview = menuPreviewText(f);

  slot.innerHTML =
    '<div class="form-box" role="group" aria-label="'+(f.id?"แก้ไขเมนู":"เพิ่มเมนูใหม่")+'">'+
      '<div class="form-title">'+(f.id?"แก้ไขเมนู":"เพิ่มเมนูใหม่")+'</div>'+
      '<div><label class="sr-only" for="mName">ชื่อเมนู</label>'+

function toast(message, kind, action){
  var t = document.getElementById("toast");
  t.dataset.kind = kind === "error" ? "error" : "ok";
  t.innerHTML = '<span class="msg">'+esc(message)+'</span>';
  if (action){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = action.label;
    b.addEventListener("click", function(){ hideToast(); action.action(); });
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(hideToast, action ? 7000 : 2600);
}
function hideToast(){
  var t = document.getElementById("toast");
  t.classList.remove("show");
  clearTimeout(t._timer);
}

function validateName(name, ignoreId){
  if (!name) return "ยังไม่ได้พิมพ์ชื่อ";
  if (name.length > MAX_NAME) return "ชื่อยาวเกิน "+MAX_NAME+" ตัวอักษร";
  var dup = state.members.some(function(p){
    return p.id !== ignoreId && p.name.toLowerCase() === name.toLowerCase();
  });
  if (dup) return "มีชื่อ " + name + " ในโต๊ะแล้ว ลองเติมนามสกุลหรือชื่อเล่นให้ต่างกัน";
  return "";
}

  if (index < 0) return;
  var member = state.members[index];
  var affected = menusOf(id).map(function(m){ return m.id; });

  ui.undo = { kind:"member", member:member, index:index, menuIds:affected };
  state.members.splice(index,1);
  state.menus.forEach(function(m){

  });

async function undoRemove(){
  if (!ui.undo) return;
  var u = ui.undo;
  ui.undo = null;
  clearTimeout(ui.undoTimer);

  if (u.kind === "menu"){
    state.menus.splice(Math.min(u.index, state.menus.length), 0, u.menu);
    render();
    await commit("คืนเมนู "+u.menu.name+" กลับมาแล้ว","menu");
    return render();
  }

  state.members.splice(Math.min(u.index, state.members.length), 0, u.member);
  state.menus.forEach(function(m){
    if (u.menuIds.indexOf(m.id) >= 0 && m.eaters.indexOf(u.member.id) < 0) m.eaters.push(u.member.id);
  });
  render();
  await commit("คืนชื่อ "+u.member.name+" กลับมาแล้ว","member");
  render();
}

/* ---- v1.4: เมนูแนะนำระหว่างพิมพ์ + จำเมนูที่เคยสั่งให้เอง ---- */
var SUGGEST_LIMIT = 8;

function menuSuggestions(query){
  var q = normText(query);
  var seen = {}, hits = [];
  function consider(name, norm, price, remembered, tierBase){
    if (seen[norm]) return;
    var pos = q ? norm.indexOf(q) : 0;
    if (q && pos < 0) return;
    seen[norm] = true;
    hits.push({
      name:name, price:(price===undefined?null:price), remembered:!!remembered,
      tier:tierBase + (pos===0 ? 0 : 1), len:name.length
    });
  }
  var mem = state.menuMemory.slice().sort(function(a,b){
    return (b.count||0)-(a.count||0) || (b.at||0)-(a.at||0);
  });

  if (!q){
    // ยังไม่พิมพ์อะไร = เสนอเมนูที่ผู้ใช้สั่งบ่อยก่อน
    mem.slice(0,6).forEach(function(m){
      consider(m.name, normText(m.name), m.price, true, 0);
    });
    return { items:hits, total:mem.length };
  }

  mem.forEach(function(m){
    consider(m.name, normText(m.name), m.price, true, 0);
  });
  MENU_LIBRARY.forEach(function(l){
    consider(l.name, l.norm, null, false, 2);
  });
  hits.sort(function(a,b){
    return a.tier - b.tier || a.len - b.len || a.name.localeCompare(b.name, "th");
  });
  return { items:hits.slice(0, SUGGEST_LIMIT), total:hits.length };
}

function highlight(name, query){
  var q = String(query||"").trim();
  if (!q) return esc(name);
  var i = normText(name).indexOf(normText(q));
  if (i < 0) return esc(name);
  return esc(name.slice(0,i))+"<b>"+esc(name.slice(i,i+q.length))+"</b>"+esc(name.slice(i+q.length));
}

function renderSuggestions(){
  var box = document.getElementById("mSuggest");
  var input = document.getElementById("mName");
  if (!box || !input) return;
  var query = input.value;
  var found = ui.suggest.open ? menuSuggestions(query) : { items:[], total:0 };
  var items = found.items;
  ui.suggest.items = items;
  ui.suggest.total = found.total;
  if (ui.suggest.active >= items.length) ui.suggest.active = -1;

  if (!items.length){
    box.innerHTML = "";
    input.setAttribute("aria-expanded","false");
    return;
  }
  var head = String(query||"").trim()
    ? (found.total > items.length
        ? "เมนูแนะนำ "+items.length+" จาก "+found.total+" รายการ — พิมพ์ต่อเพื่อกรองให้แคบลง"
        : "เมนูแนะนำ "+items.length+" รายการ")
    : "เมนูที่คุณสั่งบ่อย";
  box.innerHTML = '<div class="suggest" id="mSuggestList" role="listbox" aria-label="เมนูแนะนำ">'+
    '<div class="s-head">'+head+'</div>'+
    items.map(function(it,i){
      return '<button type="button" role="option" id="mSuggest'+i+'" data-suggest="'+i+'" aria-selected="'+(i===ui.suggest.active)+'">'+
        '<span class="s-name">'+highlight(it.name, query)+'</span>'+
        (it.remembered ? '<span class="s-tag">เคยสั่ง</span>' : '')+
        (it.price!=null ? '<span class="s-price">'+baht(it.price)+'</span>' : '')+
      '</button>';
    }).join("")+
  '</div>';
  input.setAttribute("aria-expanded","true");
  var active = items[ui.suggest.active];
  input.setAttribute("aria-activedescendant", active ? ("mSuggest"+ui.suggest.active) : "");
}

function moveSuggestion(step){
  var n = ui.suggest.items.length;
  if (!n) return;
  var next = ui.suggest.active + step;
  if (next < 0) next = n - 1;
  if (next >= n) next = 0;
  ui.suggest.active = next;
  renderSuggestions();
}

function closeSuggestions(){
  ui.suggest = { open:false, items:[], active:-1, total:0 };
  var box = document.getElementById("mSuggest");
  if (box) box.innerHTML = "";
  var input = document.getElementById("mName");
  if (input){ input.setAttribute("aria-expanded","false"); input.setAttribute("aria-activedescendant",""); }
}

function pickSuggestion(i){
  var it = ui.suggest.items[i];
  if (!it || !state.menuForm) return;
  var nameEl = document.getElementById("mName");
  var priceEl = document.getElementById("mPrice");
  if (nameEl) nameEl.value = it.name;
  if (priceEl && it.price!=null && !String(priceEl.value).trim()) priceEl.value = it.price;
  syncMenuForm();
  ui.menuErr.name = "";
  if (priceEl && String(priceEl.value).trim()) ui.menuErr.price = "";
  closeSuggestions();
  ui.focusMenuField = "mPrice";
  renderMenus();
}

/** จำเมนูที่เพิ่งบันทึกไว้ใช้ครั้งต่อไป — ล้มเหลวก็ไม่กระทบบิลที่บันทึกแล้ว */
async function rememberMenu(name, price){
  var key = normText(name);
  var found = null;
  state.menuMemory.forEach(function(m){ if (normText(m.name)===key) found = m; });
  if (found){
    found.name = name;
    found.price = price;
    found.count = (found.count||1) + 1;
    found.at = Date.now();
  } else {
    state.menuMemory.push({ name:name, price:price, count:1, at:Date.now() });
  }
  state.menuMemory.sort(function(a,b){
    return (b.count||0)-(a.count||0) || (b.at||0)-(a.at||0);
  });
  if (state.menuMemory.length > MENU_MEMORY_LIMIT) state.menuMemory = state.menuMemory.slice(0, MENU_MEMORY_LIMIT);
  try { await Store.saveMenus(state.menuMemory); } catch(e){}
}

function syncMenuForm(){

function menuPreviewText(f){

  if (isNaN(price) || price < 0) return "หาร "+f.eaters.length+" คน · ใส่ราคาแล้วจะคิดให้ทันที";
  return "หาร "+f.eaters.length+" คน · คนละ "+baht(price/f.eaters.length)+" บาท";

function updateMenuPreview(){
  var el = document.getElementById("mPreview");

}
function validateMenuForm(f){
  var errs = { name:"", price:"", eaters:"" };
  var name = String(f.name||"").trim();
  if (!name) errs.name = "ยังไม่ได้ใส่ชื่อเมนู";
  else if (name.length > MAX_MENU_NAME) errs.name = "ชื่อเมนูยาวเกิน "+MAX_MENU_NAME+" ตัวอักษร";

  var raw = String(f.price===undefined?"":f.price).trim();
  var price = parseFloat(raw);
  if (raw === "") errs.price = "ยังไม่ได้ใส่ราคา";
  else if (isNaN(price)) errs.price = "ราคาต้องเป็นตัวเลข เช่น 60 หรือ 60.50";
  else if (price < 0) errs.price = "ราคาต้องไม่ติดลบ";
  else if (price > MAX_PRICE) errs.price = "ราคาสูงเกินจริง ลองตรวจจำนวนศูนย์อีกครั้ง";

  if (state.members.length === 0) errs.eaters = "ยังไม่มีใครในโต๊ะ กลับไปเพิ่มชื่อในขั้นที่ 1 ก่อน";
  else if (f.eaters.length === 0) errs.eaters = "เลือกคนที่กินเมนูนี้อย่างน้อย 1 คน";
  return errs;
}
async function saveMenuForm(){
  var f = state.menuForm;
  if (!f || ui.savingMenu) return;
  syncMenuForm();
  ui.menuErr = validateMenuForm(f);
  if (ui.menuErr.name || ui.menuErr.price || ui.menuErr.eaters){
    ui.focusMenuField = ui.menuErr.name ? "mName" : (ui.menuErr.price ? "mPrice" : null);
    return renderMenus();
  }
  var name = String(f.name).trim().replace(/\s+/g," ");
  var price = parseFloat(String(f.price));
  var editing = !!f.id;

  ui.savingMenu = true;
  renderMenus();

  if (editing){
    state.menus.forEach(function(x){
      if (x.id===f.id){ x.name=name; x.price=price; x.eaters=f.eaters.slice(); }
    });
  } else {
    state.menus.push({ id:nid(), name:name, price:price, eaters:f.eaters.slice() });
  }
  state.menuForm = null;
  ui.menuErr = {};

  closeSuggestions();
  await commit(editing ? "บันทึก "+name+" แล้ว" : "เพิ่ม "+name+" "+baht(price)+" บาท แล้ว", "menu");
  await rememberMenu(name, price);
  ui.savingMenu = false;
  render();
}
async function duplicateMenu(id){
  var index = -1;
  state.menus.forEach(function(m,i){ if (m.id===id) index = i; });
  if (index < 0) return;
  var src = state.menus[index];
  state.menus.splice(index+1, 0, { id:nid(), name:src.name, price:src.price, eaters:src.eaters.slice() });
  render();
  await commit("เพิ่ม "+src.name+" อีกจานแล้ว","menu");
  render();
}
async function removeMenu(id){
  var index = -1;
  state.menus.forEach(function(m,i){ if (m.id===id) index = i; });
  if (index < 0) return;
  var menu = state.menus[index];
  ui.undo = { kind:"menu", menu:menu, index:index };
  state.menus.splice(index,1);
  if (state.menuForm && state.menuForm.id===id){ state.menuForm=null; ui.menuErr={}; }
  render();
  await commit(null,"menu");
  render();
  clearTimeout(ui.undoTimer);
  ui.undoTimer = setTimeout(function(){ ui.undo = null; }, 8000);
  toast("ลบ "+menu.name+" แล้ว","ok",{ label:"เลิกทำ", action:undoRemove });
}

  state.menus = [
    { id:nid(), name:"ตำซั่ว", price:60, eaters:ids("มาร์ค","พูบ","โอชิ") },
    { id:nid(), name:"ไก่ย่างเขาสวนกวาง", price:135, eaters:ids("พูบ","ชาเน่","โบ","ยูกะ","มาร์ค","โอชิ","เจ้าสั่ว") },
    { id:nid(), name:"ลาบคั่ว", price:80, eaters:ids("มาร์ค","โอชิ","พูบ","กิติภูมิ","เจ้าสั่ว") },
    { id:nid(), name:"ซอยจุ๊", price:100, eaters:ids("กิติภูมิ","เจ้าสั่ว") },
    { id:nid(), name:"เนื้อเสือร้องไห้", price:100, eaters:ids("มาร์ค","กิติภูมิ","เจ้าสั่ว") }
  ];
  state.shared = [
    { id:nid(), name:"น้ำโค้ก", price:45 },
    { id:nid(), name:"น้ำเปล่า", price:20 },
    { id:nid(), name:"ข้าวเหนียว", price:80 }
  ];
  state.menuForm=null; state.sharedForm=null; state.chargeForm=null; state.open={};
  ui.confirmMember=null; ui.editingMember=null; ui.memberError=""; ui.undo=null;
  render();
  await commit("ใส่ข้อมูลตัวอย่างแล้ว");
  render();
}

/* =========================================================
   9. เส้นทางหน้า
   ========================================================= */
var routes = {
  "/":      { title:"FairDish — จ่ายตามที่กินจริง จบทุกมื้ออย่างแฟร์", view:pageHome },
  "/split": { title:"หารบิล · FairDish", view:pageSplit },
  "/bill":  { title:"ใบสรุปยอด · FairDish", view:pageBill },
  "/how":   { title:"วิธีใช้ · FairDish", view:pageHow },
  "/about": { title:"เกี่ยวกับ · FairDish", view:pageAbout }
};
function currentPath(){
  var h = location.hash.replace(/^#/,"");
  return routes[h] ? h : "/";
}
function route(){
  var path = currentPath();
  var r = routes[path];
  document.title = r.title;
  document.getElementById("view").innerHTML = r.view();
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(a){
    a.classList.toggle("on", a.getAttribute("data-nav")===path);
  });
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("burger").setAttribute("aria-expanded","false");
  if (path==="/split") render();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

/* =========================================================
   10. เหตุการณ์
   ========================================================= */
document.getElementById("burger").addEventListener("click", function(){
  var s = document.getElementById("sheet");
  var open = s.classList.toggle("open");
  this.setAttribute("aria-expanded", open ? "true" : "false");
});

document.addEventListener("keydown", function(e){
  if (!e.target) return;
  if (e.target.id === "mName" && ui.suggest.open){
    if (e.key === "ArrowDown"){ e.preventDefault(); return moveSuggestion(1); }
    if (e.key === "ArrowUp"){ e.preventDefault(); return moveSuggestion(-1); }
    if (e.key === "Escape"){ e.preventDefault(); return closeSuggestions(); }
    if (e.key === "Enter" && ui.suggest.active >= 0){ e.preventDefault(); return pickSuggestion(ui.suggest.active); }
  }
  if (e.key !== "Enter") return;
  if (e.target.id === "memberInput"){ e.preventDefault(); addMember(); }
  if (e.target.id === "editMemberInput"){ e.preventDefault(); saveEdit(ui.editingMember); }
  if (e.target.id === "mName" || e.target.id === "mPrice"){ e.preventDefault(); saveMenuForm(); }
});
document.addEventListener("input", function(e){
  if (e.target && (e.target.id === "mName" || e.target.id === "mPrice")){
    var key = e.target.id === "mName" ? "name" : "price";
    if (ui.menuErr && ui.menuErr[key]){
      ui.menuErr[key] = "";
      var box = document.getElementById(e.target.id+"Msg");
      if (box){ box.className = "field-msg muted"; box.textContent = ""; }
      e.target.setAttribute("aria-invalid","false");
    }
    if (e.target.id === "mPrice") updateMenuPreview();
    if (e.target.id === "mName"){
      ui.suggest.open = true;
      ui.suggest.active = -1;
      renderSuggestions();
    }
  }
  if (e.target && e.target.id === "memberInput" && ui.memberError){
    ui.memberError = "";
    var value = e.target.value;
    renderMembers();
    var el = document.getElementById("memberInput");
    if (el){ el.value = value; el.focus(); }
  }
});

document.addEventListener("click", async function(e){
  if (ui.suggest.open && e.target.closest && !e.target.closest("#mSuggest") && e.target.id !== "mName"){
    closeSuggestions();
  }
  var toggle = e.target.closest ? e.target.closest("[data-toggle]") : null;
  if (toggle){
    var toggleId = toggle.getAttribute("data-toggle");
    if (state.open[toggleId]) delete state.open[toggleId]; else state.open[toggleId] = true;
    if (currentPath()==="/bill") document.getElementById("view").innerHTML = pageBill();
    else renderSummary();
    return;
  }

  var sel = "[data-del-member],[data-edit-member],[data-save-member],[data-cancel-edit],[data-confirm-del],[data-cancel-del],"+
            "[data-edit-menu],[data-dup-menu],[data-del-menu],[data-eat],[data-eat-all],[data-suggest],"+
            "[data-charge],[data-del-charge],[data-del-shared],"+
            "#menuOpen,#mSave,#mCancel,#sharedOpen,#sSave,#sCancel,#chargeOpen,#cSave,#cCancel,"+
            "#copyBtn,#demoBtn,#resetBtn,#cancelReset,#confirmReset,#memberAdd,#retrySave";
  var t = e.target.closest ? e.target.closest(sel) : null;
  if (!t) return;
  var v;

  /* ฟีเจอร์ที่ 1 */
  if (t.id==="memberAdd") return addMember();
  if (t.id==="retrySave") return retrySave();
  if ((v = t.getAttribute("data-edit-member"))) return startEdit(v);
  if ((v = t.getAttribute("data-save-member"))) return saveEdit(v);
  if (t.getAttribute("data-cancel-edit")){ ui.editingMember=null; ui.editError=""; return renderMembers(); }
  if ((v = t.getAttribute("data-del-member"))) return askDelete(v);
  if ((v = t.getAttribute("data-confirm-del"))) return removeMember(v);
  if (t.getAttribute("data-cancel-del")){ ui.confirmMember=null; return renderMembers(); }

  /* ส่วนอื่นของแอป */
  if (t.id==="demoBtn") return loadDemo();
  if (t.id==="resetBtn"){
    ui.confirmReset = true;
    document.getElementById("view").innerHTML = pageSplit();
    return render();
  }
  if (t.id==="cancelReset"){
    ui.confirmReset = false;
    document.getElementById("view").innerHTML = pageSplit();
    return render();
  }
  if (t.id==="confirmReset"){
    ui.confirmReset = false;
    state.members=[]; state.menus=[]; state.shared=[];
    state.charges = state.charges.filter(function(c){ return c.fixed; });
    state.charges.forEach(function(c){ c.on=false; });
    state.menuForm=null; state.sharedForm=null; state.chargeForm=null; state.open={};
    ui.confirmMember=null; ui.editingMember=null; ui.memberError=""; ui.undo=null;
    document.getElementById("view").innerHTML = pageSplit();
    render();
    await commit("ล้างข้อมูลแล้ว");
    return render();
  }

  if (t.id==="menuOpen"){
    state.menuForm={ id:null, name:"", price:"", eaters:[] };
    ui.menuErr={}; ui.focusMenuField="mName";
    ui.suggest={ open:true, items:[], active:-1, total:0 };
    return renderMenus();
  }
  if ((v = t.getAttribute("data-suggest")) !== null) return pickSuggestion(parseInt(v,10));
  if ((v = t.getAttribute("data-edit-menu"))){
    var m = state.menus.filter(function(x){ return x.id===v; })[0];
    if (m){ state.menuForm={ id:m.id, name:m.name, price:m.price, eaters:m.eaters.slice() }; ui.menuErr={}; }
    closeSuggestions();
    return renderMenus();
  }
  if ((v = t.getAttribute("data-dup-menu"))) return duplicateMenu(v);
  if ((v = t.getAttribute("data-del-menu"))) return removeMenu(v);
  if ((v = t.getAttribute("data-eat"))){
    syncMenuForm();
    var f = state.menuForm;
    var i = f.eaters.indexOf(v);
    if (i>=0) f.eaters.splice(i,1); else f.eaters.push(v);
    if (f.eaters.length) ui.menuErr.eaters = "";
    return renderMenus();
  }
  if (t.getAttribute("data-eat-all")){
    syncMenuForm();
    var ff = state.menuForm;
    ff.eaters = ff.eaters.length===state.members.length ? [] : state.members.map(function(p){ return p.id; });
    if (ff.eaters.length) ui.menuErr.eaters = "";
    return renderMenus();
  }
  if (t.id==="mCancel"){ state.menuForm=null; ui.menuErr={}; closeSuggestions(); return renderMenus(); }
  if (t.id==="mSave") return saveMenuForm();

  if ((v = t.getAttribute("data-del-charge"))){
    e.stopPropagation();
    state.charges = state.charges.filter(function(c){ return c.id!==v; });
    render();
    await commit("ลบค่าใช้จ่ายแล้ว");
    return render();
  }
  if ((v = t.getAttribute("data-charge"))){
    state.charges.forEach(function(c){ if (c.id===v) c.on = !c.on; });
    render();
    await commit();
    return render();
  }
  if (t.id==="chargeOpen"){ state.chargeForm={}; return renderCharges(); }
  if (t.id==="cCancel"){ state.chargeForm=null; return renderCharges(); }
  if (t.id==="cSave"){
    var cl = document.getElementById("cLabel").value.trim();
    var cr = parseFloat(document.getElementById("cRate").value);
    if (!cl) return toast("ใส่ชื่อค่าใช้จ่ายก่อน","error");
    if (!(cr>=0)) return toast("ใส่เปอร์เซ็นต์เป็นตัวเลข","error");
    state.charges.push({ id:nid(), label:cl, rate:cr, on:true, fixed:false });
    state.chargeForm=null;
    render();
    await commit("เพิ่มค่าใช้จ่ายแล้ว");
    return render();
  }

  if (t.id==="sharedOpen"){ state.sharedForm={}; return renderShared(); }
  if (t.id==="sCancel"){ state.sharedForm=null; return renderShared(); }
  if (t.id==="sSave"){
    var sn = document.getElementById("sName").value.trim();
    var sp = parseFloat(document.getElementById("sPrice").value);
    if (!sn) return toast("ใส่ชื่อรายการก่อน","error");
    if (!(sp>=0)) return toast("ใส่ราคาเป็นตัวเลข","error");
    state.shared.push({ id:nid(), name:sn, price:sp });
    state.sharedForm=null;
    render();
    await commit("เพิ่มค่าส่วนกลางแล้ว");
    return render();
  }
  if ((v = t.getAttribute("data-del-shared"))){
    state.shared = state.shared.filter(function(s){ return s.id!==v; });
    render();
    await commit("ลบรายการแล้ว");
    return render();
  }

  if (t.id==="copyBtn") return copySummary();
});

/* =========================================================
   11. เริ่มทำงาน
   ========================================================= */
async function boot(){
  MENU_LIBRARY = buildMenuLibrary();
  route();
  await Store.init();
  try {
    var saved = await Store.load();
    if (saved && saved.members){
      state.members = saved.members || [];
      state.menus = (saved.menus || []).map(function(m){
        return { id:m.id, name:m.name, price:Number(m.price)||0, eaters:m.eaters||[] };
      });
      state.shared = saved.shared || [];
      if (saved.charges && saved.charges.length) state.charges = saved.charges;
      var maxId = 0;
      state.members.concat(state.menus, state.shared).forEach(function(x){
        var num = parseInt(String(x.id).replace(/^i/,""),10);
        if (!isNaN(num) && num > maxId) maxId = num;
      });
      uid = maxId;
    }
    try { state.menuMemory = await Store.loadMenus(); } catch(e){ state.menuMemory = []; }
    ui.loading = false;
    setSave("saved");
  } catch(err){
    ui.loading = false;
    setSave("error");
    toast("โหลดข้อมูลเดิมไม่สำเร็จ เริ่มบิลใหม่ได้เลย","error");
  }
  if (currentPath()==="/split") render();
  if (currentPath()==="/bill") document.getElementById("view").innerHTML = pageBill();
}
boot();
</script>
